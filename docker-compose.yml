# Docker Compose for Enterprise RAG
# 
# Usage:
#   docker-compose up          # Start services
#   docker-compose down        # Stop services
#   docker-compose logs -f     # View logs

version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-rag
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT_API_KEY=enterprise_rag_key  # Optional: Set API key
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_storage:
    driver: local

# Networks (optional)
# networks:
#   rag-network:
#     driver: bridge
