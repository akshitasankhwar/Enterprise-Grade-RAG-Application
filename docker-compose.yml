# Docker Compose for Enterprise RAG
# 
# Usage (run from this folder):
#   docker compose up -d       # Start services
#   docker compose down        # Stop services
#   docker compose logs -f     # View logs

# Fixed project name so the data volume keeps its name if the folder is moved or renamed
name: enterprise-grade-rag-application-main

services:
  qdrant:
    # Pinned to match qdrant-client (minor versions must be within 1 of each other)
    image: qdrant/qdrant:v1.20.0
    container_name: qdrant-rag
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_storage:
    driver: local

# Networks (optional)
# networks:
#   rag-network:
#     driver: bridge
